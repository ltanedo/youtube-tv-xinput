name: Desktop beta
on:
  pull_request:
    paths: ['native/**', 'inject/**', 'scripts/**', 'package*.json', '.github/workflows/desktop.yml']
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.arch }}
          cache-on-failure: true
          workspaces: |
            native/core
            node_modules/pake-cli/src-tauri
      - run: npm test
        if: matrix.arch == 'x64'
      # Pake's --targets picks the Windows architecture (x64 / arm64); the ARM64
      # installer is cross-compiled on the x64 runner.
      - run: npm run build -- --targets ${{ matrix.arch }}
      - name: Test native controller merge and mappings
        if: matrix.arch == 'x64'
        run: cargo test --release --target x86_64-pc-windows-msvc --features cli-build --manifest-path node_modules/pake-cli/src-tauri/Cargo.toml --lib pake_xinput::tests
      - name: Name the installer after the release version and architecture
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mv YouTubeTV.msi "YouTubeTV-${version}-Windows-${{ matrix.arch }}.msi"
          mv YouTubeTV.exe "YouTubeTV-${version}-Windows-${{ matrix.arch }}-portable.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            YouTubeTV-*.msi
            YouTubeTV-*-portable.exe

  # Linux x64: a .deb (Ubuntu/Debian), Pake's Arch package (.pkg.tar.zst, repacked
  # from the .deb; installs with pacman -U on Arch and derivatives such as Omarchy)
  # and a self-contained AppImage with WebKitGTK and GStreamer bundled. The AppImage
  # inherits the runner's glibc floor (Ubuntu 24.04: glibc 2.39).
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri's Linux build dependencies, Arch packaging tools and the GStreamer plugins the AppImage bundles
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf \
            libssl-dev libxdo-dev libudev-dev libarchive-tools file \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-gl
      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64
          cache-on-failure: true
          workspaces: |
            native/core
            node_modules/pake-cli/src-tauri
      - run: npm test
      # NO_STRIP: linuxdeploy's bundled strip cannot read binaries built on glibc 2.38+.
      - run: npm run build -- --targets deb,appimage,zst
        env:
          NO_STRIP: true
      - name: Test native blocker rules and controller mapping
        run: cargo test --release --features cli-build --manifest-path node_modules/pake-cli/src-tauri/Cargo.toml --lib -- pake_adblock::tests pake_gamepad::tests
      # Pake lowercases the app name in its Linux output (youtubetv.deb, youtubetv.AppImage,
      # youtubetv-<pkgver>-1-x86_64.pkg.tar.zst).
      - name: Name the packages after the release version and architecture
        run: |
          version=$(node -p "require('./package.json').version")
          mv youtubetv.deb "YouTubeTV-${version}-Linux-x64.deb"
          mv youtubetv.AppImage "YouTubeTV-${version}-Linux-x64.AppImage"
          mv youtubetv-*-x86_64.pkg.tar.zst "YouTubeTV-${version}-Linux-x64.pkg.tar.zst"
          chmod +x "YouTubeTV-${version}-Linux-x64.AppImage"
          ls -l YouTubeTV-*
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          if-no-files-found: error
          path: |
            YouTubeTV-*.deb
            YouTubeTV-*.AppImage
            YouTubeTV-*.pkg.tar.zst

  # Pushing a v* tag publishes the Windows and Linux packages (plus checksums) as
  # a GitHub release; a tag with a prerelease suffix (v2.2.0-beta.2) is marked
  # as a prerelease. If the release already exists (for example created by hand
  # with locally built packages), only assets it does not have yet are added, so
  # hand-uploaded packages and their SHA256SUMS.txt are never replaced.
  release:
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v${version}" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json v${version}"; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum YouTubeTV-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          args=(--title "YouTube TV ${GITHUB_REF_NAME}" --notes-file ../.github/release-notes.md)
          case "${GITHUB_REF_NAME}" in *-*) args+=(--prerelease);; esac
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            existing=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name')
            missing=()
            for file in YouTubeTV-* SHA256SUMS.txt; do
              grep -qxF "$file" <<<"$existing" && echo "keeping existing $file" || missing+=("$file")
            done
            [ ${#missing[@]} -eq 0 ] || gh release upload "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" "${missing[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" "${args[@]}" YouTubeTV-* SHA256SUMS.txt
          fi
