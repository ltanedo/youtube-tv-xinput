name: Android port
on:
  pull_request:
    paths: ['android/**', 'native/core/**', 'native/tv-*.js', 'inject/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108'
      - run: cargo install cargo-ndk --locked --version 4.1.2
      - run: ./android/gradlew -p android assembleDebug assembleDebugAndroidTest lintDebug
      - run: cargo test --locked --manifest-path native/core/Cargo.toml
      - run: node scripts/test-gamepad.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/androidTest/debug/*.apk
            android/app/build/reports/lint-results-debug.*
