[package]
name = "pake-blocker-core"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[dependencies]
adblock = { version = "=0.13.3", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"
